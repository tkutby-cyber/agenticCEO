name: Generate Lia PT-BR Voice
on:
  push:
    paths:
      - 'lia-voice/**'
      - '.github/workflows/lia-ptbr-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: lia-voice
        run: npm install
      - name: Generate PT-BR audio
        working-directory: lia-voice
        run: npm run generate
      - uses: actions/upload-artifact@v4
        with:
          name: lia-ptbr-audio
          path: lia-voice/lia-ptbr.mp3
      - name: Publish audio in repository
        run: |
          mkdir -p public-assets
          cp lia-voice/lia-ptbr.mp3 public-assets/lia-ptbr.mp3
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public-assets/lia-ptbr.mp3
          git diff --cached --quiet || git commit -m "Update Lia PT-BR audio asset"
          git push
