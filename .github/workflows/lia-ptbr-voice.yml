name: Generate Lia PT-BR Voice
on:
  push:
    paths:
      - 'lia-voice/**'
      - '.github/workflows/lia-ptbr-voice.yml'
  workflow_dispatch:
jobs:
  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lia-voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run generate
      - uses: actions/upload-artifact@v4
        with:
          name: lia-ptbr-audio
          path: lia-voice/lia-ptbr.mp3
